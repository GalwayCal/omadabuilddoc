; Copy to omada.ini and fill in. Environment variables (OMADA_URL, OMADA_CLIENT_ID,
; OMADA_CLIENT_SECRET, ...) and command-line flags override these values.


[omada]
url = https://XX:8043
client_id = XX
client_secret = XX
; omadac_id is auto-detected from /api/info; set it only if that is blocked
; omadac_id = XX

; Self-signed controller certificate: either point at the CA/cert PEM...
; ca_bundle = C:\certs\omada-ca.pem
; ...or skip verification (only on a trusted network)
insecure = true

; Cover page
title = X
customer = X
author = X
; logo = logo.png

